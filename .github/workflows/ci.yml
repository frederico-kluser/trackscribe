name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "24.x"]
    name: build & test (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install ffmpeg (probe/extract integration tests need it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # No OPENAI_API_KEY / HF_TOKEN on purpose: tests must never hit the
      # network, and whisperx is absent so diarization e2e auto-skips.
      - run: npm test
        env:
          CI: "true"
